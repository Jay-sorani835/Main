<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Service Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
        .login-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #004494; }
        .error { color: #dc3545; background: #f8d7da; padding: 0.5rem; border-radius: 4px; border: 1px solid #f5c6cb; margin-bottom: 1rem; }
        .logout { color: #28a745; background: #d4edda; padding: 0.5rem; border-radius: 4px; border: 1px solid #c3e6cb; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Sign In</h2>
        <div th:if="${param.error}" class="error">
            Invalid email and password.
        </div>
        <div th:if="${param.logout}" class="logout">
            You have been logged out.
        </div>
        <form th:action="@{/perform_login}" method="post">
            <div class="form-group">
                <label for="username">Email Address</label>
                <input type="text" id="username" name="username" autofocus="autofocus" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required />
            </div>
            <button type="submit">Log in</button>
        </form>
    </div>
</body>
</html>
