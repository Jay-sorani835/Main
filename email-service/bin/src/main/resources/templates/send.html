<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Compose Email</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .form-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { padding: 0.75rem 1.5rem; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #218838; }
        .cancel-btn { background-color: #6c757d; text-decoration: none; display: inline-block; text-align: center; }
        .cancel-btn:hover { background-color: #5a6268; }
        .hint { font-size: 0.8em; color: #666; margin-top: 2px; display: block; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Compose New Email</h2>
        <form th:action="@{/send}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="to">To:</label>
                <input type="text" id="to" name="to" required placeholder="recipient@example.com, another@example.com" />
                <span class="hint">Comma separated emails</span>
            </div>
            
            <div class="form-group">
                <label for="cc">CC:</label>
                <input type="text" id="cc" name="cc" />
            </div>

            <div class="form-group">
                <label for="bcc">BCC:</label>
                <input type="text" id="bcc" name="bcc" />
            </div>

            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required />
            </div>

            <div class="form-group">
                <label for="body">Message Body:</label>
                <textarea id="body" name="body" required placeholder="HTML or Plain Text"></textarea>
            </div>

            <div class="form-group">
                <label for="files">Attachments:</label>
                <input type="file" id="files" name="files" multiple />
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit">Send Email</button>
                <a th:href="@{/inbox}" class="cancel-btn" style="padding: 0.75rem 1.5rem; color: white; border-radius: 4px;">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
